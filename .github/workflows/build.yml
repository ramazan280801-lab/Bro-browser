name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: |
          f=$(git log --diff-filter=AM --name-only --format= -- '*.zip' | grep . | head -1)
          echo "Using: $f"
          unzip -q "$f"
      - run: gradle -p bro-android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bro-browser-apk
          path: bro-android/app/build/outputs/apk/debug/app-debug.apk
